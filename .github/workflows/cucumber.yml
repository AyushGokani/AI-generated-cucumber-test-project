name: Cucumber E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: "Cucumber tags filter (e.g. @jira-DEMO-101)"
        required: false
        default: ""

jobs:
  cucumber:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Run Cucumber
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          export BASE_URL="${BASE_URL:-http://127.0.0.1:9}"
          TAGS="${{ github.event.inputs.tags }}"
          if [ -n "$TAGS" ]; then
            npm run test:cucumber -- --tags "$TAGS" || true
          else
            npm run test:cucumber -- --tags "@framework or @smoke"
          fi

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: .cucumber-report/
          if-no-files-found: ignore
